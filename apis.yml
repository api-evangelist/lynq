name: Lynq
description: >-
  Lynq Networks develops infrastructure-free, long-range wireless connectivity
  for enterprise and OEM devices, bridging the gap between short-range Bluetooth
  and infrastructure-dependent cellular/5G. Its technology lets original
  equipment manufacturers build large-area device networks without deploying
  traditional network infrastructure, targeting construction, agriculture,
  military, and public-safety use cases. Lynq is a Techstars-backed portfolio
  company. As of this enrichment pass the company publishes no public API,
  developer portal, SDKs, or machine-readable API documentation; this profile
  captures its identity and a domain-security probe for the API Evangelist
  network.
